name: Terraform Manual Workflow

on:
  workflow_dispatch:  # ← This enables the "Run workflow" button

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # 1. Checkout your repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # 3. Install AWS CLI
      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      # 4. Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::891377101284:role/github-admin
          aws-region: us-east-1

      # 5. Terraform Init
      - name: Terraform Init
        working-directory: github-action-mani
        run: terraform init

      # 6. Terraform Plan
      - name: Terraform Plan
        working-directory: github-action-mani
        run: terraform plan

      # 7. Terraform Apply
      - name: Terraform Apply
        working-directory: github-action-mani
        run: terraform apply -auto-approve
